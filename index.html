<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你好，朋友 👋</title>
    <style>
        :root {
            --green-900: #14532d;
            --green-700: #15803d;
            --green-600: #16a34a;
            --green-500: #22c55e;
            --green-200: #bbf7d0;
            --green-100: #dcfce7;
            --green-50:  #f0fdf4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            background: var(--green-50);
        }

        /* 顶部标题栏 */
        header {
            background: linear-gradient(135deg, var(--green-600), var(--green-500));
            color: #fff;
            padding: 20px 24px;
            box-shadow: 0 2px 12px rgba(20, 83, 45, 0.18);
        }

        header .title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        header .subtitle {
            margin-top: 4px;
            font-size: 14px;
            opacity: 0.9;
        }

        /* 消息流 */
        .feed {
            flex: 1;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .empty {
            text-align: center;
            color: var(--green-700);
            font-size: 15px;
            padding: 60px 0;
        }

        .msg {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            animation: pop 0.25s ease;
        }

        @keyframes pop {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .msg .avatar {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--green-100);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .msg .bubble {
            background: #fff;
            padding: 12px 16px;
            border-radius: 16px;
            border-top-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(20, 83, 45, 0.10);
        }

        .msg .who {
            font-size: 13px;
            color: var(--green-600);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .msg .text {
            font-size: 16px;
            color: var(--green-900);
        }

        /* 底部输入区 */
        footer {
            background: #fff;
            border-top: 1px solid var(--green-100);
            padding: 16px 20px;
            box-shadow: 0 -2px 12px rgba(20, 83, 45, 0.06);
        }

        .input-wrap {
            max-width: 640px;
            margin: 0 auto;
        }

        .quick-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .quick {
            padding: 6px 14px;
            font-size: 14px;
            color: var(--green-700);
            background: var(--green-100);
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .quick:hover {
            background: var(--green-200);
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 13px 16px;
            font-size: 16px;
            border: 2px solid var(--green-200);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input:focus {
            border-color: var(--green-500);
        }

        button {
            padding: 13px 22px;
            font-size: 16px;
            color: #fff;
            background: var(--green-600);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        button:hover {
            background: var(--green-700);
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <header>
        <div class="title">🌿 你好呀，好久不见</div>
        <div class="subtitle">输入朋友的名字，打个招呼吧～</div>
    </header>

    <main class="feed" id="feed">
        <p class="empty" id="emptyTip">还没有问候，从下面开始和朋友打招呼吧 👇</p>
    </main>

    <footer>
        <div class="input-wrap">
            <div class="quick-list" id="quickList"></div>
            <div class="input-row">
                <input id="nameInput" type="text" placeholder="朋友的名字" maxlength="20">
                <button id="greetBtn">打招呼</button>
            </div>
        </div>
    </footer>

    <script>
        const feed = document.getElementById('feed');
        const emptyTip = document.getElementById('emptyTip');
        const nameInput = document.getElementById('nameInput');
        const greetBtn = document.getElementById('greetBtn');
        const quickList = document.getElementById('quickList');

        // 一些可爱的打招呼语
        const phrases = [
            '见到你真开心！',
            '最近过得怎么样呀？',
            '好久不见，想你了！',
            '今天也要元气满满哦！',
            '有你在真好～',
            '祝你有美好的一天！'
        ];

        // 常用称呼快捷按钮
        const quickNames = ['小明', '小红', '阿绿', '小刚', '花花'];

        // 每条消息配一个随机的小头像表情
        const avatars = ['😊', '🐢', '🌱', '🍀', '🐸', '🌵'];

        function greet(name) {
            const clean = name.trim();
            if (!clean) {
                nameInput.focus();
                return;
            }

            // 清空空状态提示
            if (emptyTip) {
                emptyTip.remove();
            }

            const phrase = phrases[Math.floor(Math.random() * phrases.length)];
            const avatar = avatars[Math.floor(Math.random() * avatars.length)];

            const msg = document.createElement('div');
            msg.className = 'msg';

            const avatarEl = document.createElement('div');
            avatarEl.className = 'avatar';
            avatarEl.textContent = avatar;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const who = document.createElement('div');
            who.className = 'who';
            who.textContent = clean;

            const text = document.createElement('div');
            text.className = 'text';
            text.textContent = phrase;

            bubble.appendChild(who);
            bubble.appendChild(text);
            msg.appendChild(avatarEl);
            msg.appendChild(bubble);
            feed.appendChild(msg);

            msg.scrollIntoView({ behavior: 'smooth', block: 'end' });

            nameInput.value = '';
            nameInput.focus();
        }

        greetBtn.addEventListener('click', () => {
            greet(nameInput.value);
        });

        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                greet(nameInput.value);
            }
        });

        quickNames.forEach(name => {
            const tag = document.createElement('span');
            tag.className = 'quick';
            tag.textContent = name;
            tag.addEventListener('click', () => {
                nameInput.value = name;
                greet(name);
            });
            quickList.appendChild(tag);
        });
    </script>
</body>
</html>
